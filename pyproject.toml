[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-auto-editor"
version = "0.1.0"
description = "Local-first podcast auto-editor MVP"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
podcast-auto-editor = "podcast_auto_editor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=6.2"]
