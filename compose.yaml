name: podcast-auto-editor

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: podcast-auto-editor:local
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      UV_CACHE_DIR: /tmp/uv-cache-podcast-auto-editor
      OLLAMA_BASE_URL: http://ollama:11434
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      WHISPER_CPP_BINARY: ${WHISPER_CPP_BINARY:-/opt/whisper.cpp/bin/whisper-cli}
      WHISPER_CPP_MODEL_PATH: ${WHISPER_CPP_MODEL_PATH:-/models/ggml-large-v3-q5_0.bin}
    volumes:
      - .:/workspace
      - uv-cache:/tmp/uv-cache-podcast-auto-editor
      - ./runs:/workspace/runs
      - ${LOCAL_MODELS_DIR:-./models}:/models:ro
      - ${WHISPER_CPP_BIN_DIR:-./third_party/whisper.cpp/build/bin}:/opt/whisper.cpp/bin:ro
    depends_on:
      ollama:
        condition: service_started
    profiles: ["app", "ai"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["ai"]

volumes:
  ollama:
  uv-cache:
